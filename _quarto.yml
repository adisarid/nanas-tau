project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "lectures/*.qmd"
    - "calculators/*.qmd"
  resources:
    - "lectures/pdf/*.pdf"   # printable slide PDFs, made locally by scripts/slides-pdf.sh
    - "calculators/js/*.js"  # client-side code for the online calculators

execute:
  freeze: auto        # code runs locally only; CI reuses _freeze/
  warning: false
  message: false

knitr:
  opts_chunk:
    dev: ragg_png
    fig.align: center
    fig.width: 8
    fig.height: 4.5
    dpi: 150

lang: he
dir: rtl

website:
  title: "ניתוח נתונים סטטיסטי"
  site-url: https://adisarid.github.io/nanas-tau/
  repo-url: https://github.com/adisarid/nanas-tau
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: בית
      - text: הרצאות
        menu:
          - href: lectures.qmd
            text: "כל ההרצאות"
          - text: "---"
          - href: lectures/00-course-intro.qmd
            text: "0. פתיחה: על הקורס"
          - href: lectures/01-nonparametric.qmd
            text: "1. שיטות א-פרמטריות"
          - href: lectures/02-exit-polls.qmd
            text: "בונוס: למה טעו מדגמי היציאה?"
          - href: lectures/03-multiple-regression.qmd
            text: "3. רגרסיה לינארית מרובה"
          - href: lectures/04-one-way-anova.qmd
            text: "4. ניתוח שונות חד-כיווני"
          - href: lectures/05-contrasts-multiple-comparisons.qmd
            text: "5. ניגודים, השוואות מרובות וא-פרמטרי"
      - text: מחשבונים אונליין
        menu:
          - href: calculators/prediction-intervals.qmd
            text: "רווח סמך מול רווח חיזוי"
      - href: syllabus.qmd
        text: סילבוס
      - href: https://moodle.tau.ac.il/course/view.php?id=571313701
        text: Moodle
        target: _blank
    right:
      - icon: github
        href: https://github.com/adisarid/nanas-tau
        aria-label: GitHub
  page-footer:
    center: "ד״ר עדי שריד · הפקולטה להנדסה, אוניברסיטת תל אביב · תשפ״ז"
    right: "עודכן לאחרונה: 08.11.2026"   # update on every push to main (see README)

format:
  html:
    theme:
      light: [cosmo, assets/styles.scss]
      dark: [darkly, assets/styles.scss]
    toc: true
    toc-title: "בעמוד זה"
    code-fold: false
    code-tools: false
    code-copy: true
    highlight-style: github
